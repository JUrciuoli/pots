name: Keep database awake
# Free Supabase projects pause after a week with no activity. This pings it twice a week.
on:
  schedule:
    - cron: '17 15 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/config.js | head -1)
          KEY=$(grep -oE "eyJ[A-Za-z0-9_.-]+" src/config.js | head -1)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/pieces?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Database answered $code"
          test "$code" = "200"
